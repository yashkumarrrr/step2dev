<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step2Dev — Free Cloud & DevOps Audit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ------------------------
     Global Styles
  ------------------------ */
  * { box-sizing: border-box; margin:0; padding:0; font-family: 'Inter', sans-serif; }
  body { background: #0A0F1F; color: #fff; display:flex; justify-content:center; align-items:center; min-height:100vh; }
  a { text-decoration: none; }

  /* ------------------------
     Form Container
  ------------------------ */
  .form-container {
    background: #0F172A;
    padding: 40px 30px;
    border-radius: 16px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 0.8s forwards;
  }

  @keyframes fadeInUp {
    to { opacity:1; transform: translateY(0); }
  }

  h2 { text-align:center; color:#4AB3FF; margin-bottom: 25px; font-weight:700; }
  p { text-align:center; color:#bcdff8; margin-bottom:30px; }

  /* ------------------------
     Input Fields
  ------------------------ */
  .form-group {
    position: relative;
    margin-bottom: 24px;
  }

  input, textarea, select {
    width: 100%;
    background: #0A0F1F;
    border: 1px solid #374151;
    padding: 18px 16px 6px;
    border-radius: 10px;
    color: #fff;
    font-size: 1rem;
    transition: border 0.3s;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #4AB3FF;
  }

  label {
    position: absolute;
    top: 16px;
    left: 16px;
    color: #9fbfe6;
    font-size: 1rem;
    pointer-events: none;
    transition: 0.2s ease all;
  }

  input:focus + label,
  input:not(:placeholder-shown) + label,
  textarea:focus + label,
  textarea:not(:placeholder-shown) + label,
  select:focus + label,
  select:not([value=""]) + label {
    top: -8px;
    left: 12px;
    font-size: 0.85rem;
    color: #4AB3FF;
    background: #0F172A;
    padding: 0 4px;
  }

  textarea { resize: vertical; min-height: 100px; }

  /* ------------------------
     Radio Buttons
  ------------------------ */
  .radio-group { display: flex; gap: 15px; }
  .radio-group label { display:flex; align-items:center; gap:6px; font-size:0.95rem; cursor:pointer; }
  .radio-group input { accent-color: #4AB3FF; }

  /* ------------------------
     Submit Button
  ------------------------ */
  button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: #4AB3FF;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s;
  }
  button:hover { background: #3690d9; }

  /* ------------------------
     Responsive
  ------------------------ */
  @media(max-width: 500px){
    .form-container { padding: 30px 20px; }
  }
</style>
</head>
<body>

<div class="form-container">
  <h2>Step2Dev Free Audit</h2>
  <p>Fill the form below to get a free Cloud & DevOps audit.</p>

  <form action="#" method="POST">
    <!-- Name -->
    <div class="form-group">
      <input type="text" name="name" id="name" placeholder=" " required>
      <label for="name">Full Name</label>
    </div>

    <!-- Email -->
    <div class="form-group">
      <input type="email" name="email" id="email" placeholder=" " required>
      <label for="email">Email</label>
    </div>

    <!-- Company -->
    <div class="form-group">
      <input type="text" name="company" id="company" placeholder=" ">
      <label for="company">Company</label>
    </div>

    <!-- Criticality -->
    <div class="form-group">
      <label style="color:#bcdff8;">How critical is this?</label>
      <div class="radio-group">
        <label><input type="radio" name="criticality" value="very_urgent" required> Very urgent – need fix now</label>
        <label><input type="radio" name="criticality" value="medium"> Medium – this week</label>
        <label><input type="radio" name="criticality" value="not_urgent"> Not urgent – exploring options</label>
      </div>
    </div>

    <!-- Project Links -->
    <div class="form-group">
      <input type="text" name="project_links" id="project_links" placeholder=" ">
      <label for="project_links">Project links (repo, website, infra docs)</label>
    </div>

    <!-- Description -->
    <div class="form-group">
      <textarea name="description" id="description" placeholder=" "></textarea>
      <label for="description">Describe the issue / request</label>
    </div>

    <button type="submit">Get Free Audit</button>
  </form>
</div>

</body>
</html>
